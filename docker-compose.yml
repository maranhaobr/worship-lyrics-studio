services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wls
      POSTGRES_PASSWORD: wls
      POSTGRES_DB: wls
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wls -d wls"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
