services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wls
      POSTGRES_PASSWORD: wls
      POSTGRES_DB: wls
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wls -d wls"]
      interval: 5s
      timeout: 5s
      retries: 10
  alignment-worker:
    build: ./services/alignment
    profiles: [alignment]
    environment:
      DATABASE_URL: postgresql://wls:wls@postgres:5432/wls
      MEDIA_STORAGE_DIR: /media
      MODEL_CACHE_DIR: /models
      WHISPER_MODEL: small
      ALIGNMENT_DEVICE: cpu
      CPU_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    cpus: 2
    volumes:
      - ./services/alignment/app:/app/app:ro
      - ${MEDIA_STORAGE_DIR:-./.data/media}:/media:ro
      - alignment_models:/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  alignment_models:
